name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller openpyxl xlrd python-docx tkinterdnd2 pillow

      - name: Build EXE
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "宛名印刷" --icon "icon.ico" --add-data "icon.ico;." --collect-all tkinterdnd2 --hidden-import xlrd --hidden-import openpyxl "宛名印刷.pyw"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: 宛名印刷-windows
          path: dist/宛名印刷.exe
