name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # タグ push 時に Releases へ exe を添付するために必要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller openpyxl xlrd python-docx reportlab tkinterdnd2 pillow

      - name: Build EXE
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "宛名印刷" --icon "icon.ico" --add-data "icon.ico;." --collect-all tkinterdnd2 --hidden-import xlrd --hidden-import openpyxl --hidden-import reportlab.pdfbase.cidfonts --hidden-import reportlab.pdfbase.ttfonts "宛名印刷.pyw"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: 宛名印刷-windows
          path: dist/宛名印刷.exe

      # ここから下は「v1.0.1」のようなタグを push したときだけ実行される。
      # Releases の添付ファイル名は、日本語だと文字が置き換わることがあるため、
      # 英数字の名前(atena-print-タグ名.exe。例: atena-print-v1.0.1.exe)にコピーして添付する。
      - name: Rename EXE for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: cmd
        run: |
          copy "dist\宛名印刷.exe" "dist\atena-print-%GITHUB_REF_NAME%.exe"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/atena-print-${{ github.ref_name }}.exe
          generate_release_notes: true
